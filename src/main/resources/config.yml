# ============================================================
# VelocityChat — Configuration
# ============================================================
# 通用占位符 / Universal placeholders:
#   {player}  - 玩家名 / player name
#   {title}   - 群组称号(无称号时为空) / group title (empty if none)
#   {server}  - 服务器显示名 / server display name (from server-aliases)
#   {message} - 聊天内容 / chat message
#   {ping}    - 玩家延迟(ms) / player ping in ms
#   {online}  - 在线人数 (仅 header/footer) / online count (header/footer only)
#   {channel} - 频道名 (仅频道格式) / channel name (channel format only)
# 颜色字符: § (e.g. §a, §c, §6, §l, §r)
# ============================================================

# ── 语言设置 / Language ────────────────────────────────────
# 语言文件在 lang/ 文件夹中 / Language files are in the lang/ folder
# 支持的语言 / Supported languages:
#   zh_CN — 简体中文 (Chinese Simplified)
#   en_US — English (US)
language: zh_CN

# ── 广播指令别名 / Broadcast Command Aliases ──────────────
# 玩家可使用 /br <消息>、/k <消息> 或 /broadcast <消息> 发送跨服聊天
# 也可在此添加更多别名 / You can add more aliases here
# 注：/k 始终会被注册（无论是否在此列出）/ Note: /k is always registered
broadcast-aliases:
  - "br"
  - "broadcast"
  - "k"

# ── 跨服聊天冷却设置 / Broadcast Cooldown ──────────────────
# 玩家使用 /br 后需要等待的秒数（设为 0 关闭冷却）
# Cooldown in seconds between /br uses (0 = no cooldown)
# 启用权限绕过后，拥有 velocitychat.admin 权限的玩家不受限制
# When enabled, players with velocitychat.admin bypass the cooldown
broadcast-cooldown: 0
broadcast-cooldown-bypass: false
# ── 聊天格式 / Chat Format ─────────────────────────────────
# 通用占位符 / Universal placeholders:
#   {player}  - 玩家名 / player name
#   {title}   - 群组称号(无称号时为空) / group title (empty if none)
#   {server}  - 服务器显示名 / server display name (from server-aliases)
#   {message} - 聊天内容 / chat message
#   {ping}    - 玩家延迟(ms) / player ping in ms
#   {online}  - 在线人数 (仅 header/footer) / online count (header/footer only)
#   {channel} - 频道名 (仅频道格式) / channel name (channel format only)
# 跨服广播消息格式 / Broadcast message format
broadcast-format: "§6[Broadcast] §r{title}{player}§f: §7[{server}]§f {message}"
# 频道聊天消息格式 / Channel chat message format
channel-format: "§d[§6{channel}§d]§r[{title}{player}§r]§r{server} §7>>§f {message}"

# ── 跨服邀请功能 / Server Invite ───────────────────────────
# 玩家输入 /yq [消息] 会在跨服聊天中广播一个邀请，
# 其他玩家点击"点击加入"即可进入该玩家所在的服务器
# /yq [message] broadcasts a server invite into the cross-server chat;
# other players can click it to join the inviter's server
# 冷却时间（秒），设为 0 关闭冷却 / Cooldown in seconds (0 = no cooldown)
invite-cooldown: 30
# 启用权限绕过：拥有 invite-bypass-permission 的玩家无视冷却
# When enabled, players with invite-bypass-permission ignore the cooldown
invite-cooldown-bypass: false
# 绕过冷却所需的权限节点 / Permission that bypasses the invite cooldown
invite-bypass-permission: "velocitychat.admin"

# ── 违禁词检测 / Forbidden Word Filter ─────────────────────
# 开启后，跨服聊天(/br)与邀请(/yq)消息若包含违禁词将被拦截
# When enabled, /br and /yq messages containing a banned word are blocked
forbidden-words-enabled: true
# 违禁词列表存放在 banned_words.txt 中，用分号 ; 分隔，修改后执行 /vchat reload 生效
# Banned words live in banned_words.txt, separated by semicolons ; — run /vchat reload to apply
# 拥有此权限的玩家可绕过检测 / Players with this permission bypass the filter
forbidden-words-bypass-permission: "velocitychat.admin"

# ── 服务器别名 / Server Aliases ───────────────────────────
# 格式：真实服务器ID: "&a显示名称"（支持 & 颜色代码）
# Format: real_server_id: "&aDisplayName" (supports & color codes)
# 只需修改本文件即可，无需再改语言文件
# Edit only this file — no need to touch the language files anymore
server-aliases:
  # 真实服务器名: "&a显示名称"
  lobby: "&6登录服"
  survival: "&a生存服"
  minigame: "&b小游戏服"
  factions: "&c战争服"
  skyblock: "&d空岛服"
  creative: "&e创造服"

# ── 进服/切服/离服消息可见性 / Join/Switch/Leave Visibility ──
# notify-mode: 谁可以看到这些消息 / Who can see these messages
#   all   — 所有玩家都可见 / Everyone can see (default)
#   admin — 仅管理员可见（需 velocitychat.admin 权限） / Admins only
#   none  — 关闭通知 / Disabled
notify-mode: all
# 进服个人通知 / Personal join notification (sent only to the joining player)
# 进入代理时发送 / Sent when player joins the proxy
# 占位符: {player}=玩家名, {server}=服务器显示名
join-proxy-message: "§a欢迎来到服务器！你当前在 §e{server}"
# 进入子服务器时发送 / Sent when player joins a backend server
join-server-message: "§a你已进入 §e{server}"
# 分服务器自定义（可选，不配置则用上面的默认消息）/ Per-server overrides (optional)
# join-server-messages:
#   lobby: "§a欢迎来到登录服！"
#   survival: "§a你已进入 §6生存服"

# ── 分区聊天 / Chat Channels ───────────────────────────────
# 玩家可以加入不同频道，只有同频道玩家才能看到彼此的发言（跨服）
# Players can join channels; only members of the same channel see each other's
# chat (across servers).
channels-enabled: true
# 是否拦截普通聊天并路由到玩家的当前频道（设为 false 时仅 /ch <消息> 发送到频道，
# 普通聊天直接透传到后端服务器）
# Whether to intercept normal chat and route it into the player's active channel
# (when false, only /ch <message> sends to a channel and normal chat goes to the backend)
route-chat: true

# 频道列表（仅首次启动时生成 channels.yml 使用，之后在 channels.yml 或 /vchat channel 中管理）
# 如果你想在首次配置时预设频道，取消下方注释 / Uncomment to preset channels on first startup
# 格式: 频道ID: { display-name: "&a显示名", permission: 进入所需权限(可省), default: true/false }
# channels:
#   global:
#     display-name: "&a全局"
#     default: true
#   trade:
#     display-name: "&6交易"
#     permission: "velocitychat.channel.trade"

# ── 自定义 TabList / Custom TabList ────────────────────────
# 禁用时使用每个后端服务器自带的 TabList
# When disabled, each backend server's own TabList is used
# 说明：条目采用"原位更新"而非整表清空重建，因此 Carpet 模组的假人(bot)
#       在 Tab 中会被保留，不会被刷新清掉。
# Note: entries are updated in place (not cleared+rebuilt), so Carpet fake
#       players (bots) stay visible instead of being wiped on each refresh.
tablist:
  enabled: true
  # 是否接管 Tab 顶/底部(header/footer)区域 / Whether to own the header/footer region.
  # 设为 false 时，将 header/footer 让给后端 —— 如 Carpet 的 /log 会把实时日志
  #   显示在 Tab 底部，插件再覆盖会造成闪烁；关闭后插件只刷新玩家条目，不动 header/footer。
  # Set false to hand header/footer over to the backend, e.g. when Carpet /log shows
  #   live output in the tab footer. The plugin then only refreshes entries (no flicker).
  manage-header-footer: true
  # Tab 列表刷新间隔(秒) / Refresh interval for the tab list in seconds
  # 最小值 1，越大越省资源但更新越慢 / Min 1; higher saves resources but updates slower
  refresh-interval: 3
  # 顶部标题 / Header ({online} = 在线人数)
  header: "&6&lVelocityChat\n&7在线人数: &a{online}"
  # 底部说明 / Footer
  footer: "&7Footer"
  # 每个条目的显示格式 / Per-entry display format
  # 占位符见上方通用列表，额外支持 / Above placeholders plus:
  #   {group} - 群组名 / group name (empty if none)
  entry-format: "{server}§8 | &r{title}{player}"
  # 假人的单独显示格式 / Format for Carpet fake players (bots) only.
  # 留空则与 entry-format 相同 / Leave empty to share entry-format.
  bot-format: "{server}§8 | &7&o[假人]&r{title}{player}"

# ── 群组称号配置 / Group Titles ────────────────────────────
# 群组系统允许给特定玩家设置称号（显示在跨服广播的玩家名前）
# Groups let you assign titles displayed before a player's name in broadcasts
# /vchat create group <名称> [称号]  — 创建群组并设置称号（支持&颜色代码）
# /vchat group <名称> join <玩家ID>  — 将玩家加入群组 / Add a player to a group
# /vchat group <名称> settitle <称号> — 修改群组称号 / Change group title
# 称号支持 & 颜色代码，例如 &c[管理员] / Titles support & color codes
# 组数据存储在 groups.yml 文件中 / Group data is stored in groups.yml
#
# 你也可以在此预设群组（首次启动时会生成）：
# You can preset groups here (generated on first startup):
# groups:
#   admin:
#     title: "&c&l[Admin]"
#     members:
#       - "player1"
#       - "player2"
#   vip:
#     title: "&6&l[VIP]"
#     members: []

# ── 消息配置 / Messages ────────────────────────────────────
# 此处可覆盖语言文件中的特定消息，优先级高于语言文件
# Here you can override specific messages from the language file
# These overrides take priority over the language file
# 可用的消息键 / Available message keys:
#   qu_an.chat.proxy.name
#   qu_an.chat.message.connected
#   qu_an.chat.message.server_switch
#   qu_an.chat.message.disconnect
#   qu_an.chat.message.chat.default
#   qu_an.chat.message.broadcast
#   qu_an.chat.message.channel
#   qu_an.chat.message.invite
#   qu_an.chat.message.invite.click
#   qu_an.chat.message.invite.hover
#   qu_an.chat.message.filter.blocked
# messages:
#   qu_an.chat.proxy.name: "§d跨服聊天"
